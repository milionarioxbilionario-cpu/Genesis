<!DOCTYPE html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#08090c" />
    <meta name="description" content="Genesis - ponto de venda e gestao comercial para lojas." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!--
      ANTI-FLASH DO TEMA: corre ANTES do primeiro pixel. Sem isto, quem escolheu
      o modo claro via o fundo preto por um instante a cada carregamento.
      O tema e guardado em localStorage com a chave `genesis.theme`
      (ver frontend/src/theme/ThemeProvider.jsx). A cor de fundo do <style>
      abaixo acompanha para nao haver salto de branco/preto.
    -->
    <script>
      (function () {
        try {
          var t = window.localStorage.getItem('genesis.theme');
          if (t !== 'light' && t !== 'dark') {
            t = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          }
          document.documentElement.setAttribute('data-theme', t);
          document.documentElement.style.background = t === 'light' ? '#eaf7ff' : '#08090c';
          var m = document.querySelector('meta[name="theme-color"]');
          if (m) m.setAttribute('content', t === 'light' ? '#eaf7ff' : '#08090c');
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      })();
    </script>
    <style>html { background: #08090c; } html[data-theme="light"] { background: #eaf7ff; }</style>

    <title>Genesis - Gestão Comercial</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
