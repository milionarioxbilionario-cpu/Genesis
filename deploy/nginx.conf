# Genesis em producao: a app (dono + terminal POS) e o painel admin em origens
# SEPARADAS (o codigo admin nunca e servido na app). Os dois falam com o mesmo
# backend em 127.0.0.1:4000 atraves de /api (mesma origem: cookies httpOnly sem
# CORS). O certbot acrescenta o HTTPS e o redireccionamento.
# __APP_HOST__ e __ADMIN_HOST__ sao trocados pelo setup_servidor.sh.
# Cabecalhos de seguranca: deploy/genesis-seguranca.conf -> /etc/nginx/snippets/.

# Comum a /api nos dois sites.
upstream genesis_backend { server 127.0.0.1:4000; keepalive 16; }

server {
    listen 80;
    server_name __APP_HOST__;
    root /srv/genesis/app;
    client_max_body_size 2m;
    server_tokens off;

    location /api/ {
        proxy_pass http://genesis_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 90s;
    }
    # Service worker e manifest: nunca em cache (senao a actualizacao da app nao chega).
    location = /sw.js { include snippets/genesis-seguranca.conf; add_header Cache-Control "no-cache"; try_files $uri =404; }
    location = /manifest.webmanifest { include snippets/genesis-seguranca.conf; add_header Cache-Control "no-cache"; try_files $uri =404; }
    # Ficheiros com hash no nome: cache longa.
    location /assets/ { include snippets/genesis-seguranca.conf; add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }
    # Site publico (Fase 11): paginas estaticas para o Google e as pessoas.
    # Os recuos (/app.html, /index.html) servem o build anterior a Fase 11, que
    # so tinha o index.html da app: esta configuracao pode entrar antes dele.
    location = / { include snippets/genesis-seguranca.conf; add_header Cache-Control "no-cache"; try_files /index.html =404; }
    location = /planos { include snippets/genesis-seguranca.conf; add_header Cache-Control "no-cache"; try_files /planos.html /app.html /index.html; }
    location = /en { return 301 /en/; }
    location = /en/ { include snippets/genesis-seguranca.conf; add_header Cache-Control "no-cache"; try_files /en/index.html /app.html /index.html; }
    location = /en/pricing { include snippets/genesis-seguranca.conf; add_header Cache-Control "no-cache"; try_files /en/pricing.html /app.html /index.html; }
    # Paginas legais (30/10/2026).
    location = /privacidade { include snippets/genesis-seguranca.conf; add_header Cache-Control "no-cache"; try_files /privacidade.html =404; }
    location = /termos { include snippets/genesis-seguranca.conf; add_header Cache-Control "no-cache"; try_files /termos.html =404; }
    location = /en/privacy { include snippets/genesis-seguranca.conf; add_header Cache-Control "no-cache"; try_files /en/privacy.html =404; }
    location = /en/terms { include snippets/genesis-seguranca.conf; add_header Cache-Control "no-cache"; try_files /en/terms.html =404; }
    # 404 animada (frontend/scripts/gerar_404.mjs) para ficheiros que nao existem; as
    # rotas da app que nao existem mostram-na dentro da propria app (NotFound.jsx).
    error_page 404 /404.html;
    location = /404.html { include snippets/genesis-seguranca.conf; add_header Cache-Control "no-cache"; add_header X-Robots-Tag "noindex"; try_files $uri =404; }
    location = /robots.txt { include snippets/genesis-seguranca.conf; add_header Cache-Control "no-cache"; try_files $uri =404; }
    location = /sitemap.xml { include snippets/genesis-seguranca.conf; add_header Cache-Control "no-cache"; try_files $uri =404; }
    # Ficheiros que existem (icones, imagens do site) saem tal como estao;
    # qualquer outra rota e da app (SPA): app.html, fora dos motores de busca.
    location / { include snippets/genesis-seguranca.conf; add_header Cache-Control "no-cache"; try_files $uri @app; }
    location @app { include snippets/genesis-seguranca.conf; add_header Cache-Control "no-cache"; add_header X-Robots-Tag "noindex"; try_files /app.html /index.html =404; }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}

server {
    listen 80;
    server_name __ADMIN_HOST__;
    root /srv/genesis/admin;
    client_max_body_size 1m;
    server_tokens off;

    location /api/ {
        proxy_pass http://genesis_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 90s;
    }
    location /assets/ { include snippets/genesis-seguranca.conf; add_header Cache-Control "public, max-age=31536000, immutable"; try_files $uri =404; }
    location / { include snippets/genesis-seguranca.conf; add_header Cache-Control "no-cache"; add_header X-Robots-Tag "noindex, nofollow"; try_files $uri /index.html; }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
}
