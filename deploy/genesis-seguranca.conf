# Cabecalhos de seguranca das paginas (30/10/2026, revisao de seguranca).
# Incluido em cada `location` que tem add_header: no nginx, um add_header dentro
# de uma location apaga os do nivel de cima, por isso nao basta po-los no server.
# A API (/api) ja os recebe do helmet no backend.
#  - nosniff: o browser nao adivinha tipos (um ficheiro de texto nao vira script);
#  - DENY: nenhuma outra pagina mete o Genesis numa moldura (clickjacking no PIN);
#  - Referrer-Policy: os enderecos internos da app nao vao para outros sites;
#  - HSTS: o browser so volta a falar com o Genesis por HTTPS durante 1 ano.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security "max-age=31536000" always;
